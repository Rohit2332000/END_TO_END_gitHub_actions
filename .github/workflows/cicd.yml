
name: FastAPI CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastapi-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # JOB 1: CONTINUOUS INTEGRATION
  test:
    name: Code Quality and Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linting
        run: ruff check .

      - name: Check Formatting
        run: ruff format --check .

      - name: Run Unit Tests
        run: pytest -v --junitxml=test-results.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore


  # JOB 2: BUILD AND PUSH DOCKER IMAGE
  build:
    name: Build and Push to GHCR
    needs: test

    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rohit2332000/end_to_end_github_actions
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # JOB 3: CONTINUOUS DEPLOYMENT
  deploy:
    name: Deploy to AWS EC2
    needs: build

    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

        run: |
          set -e

          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e

            cd /opt/fastapi-cicd

            docker compose pull

            docker compose up -d --remove-orphans

            echo "Checking application health..."

            for i in $(seq 1 15); do
              if curl -fsS http://localhost:8000/health; then
                echo "Deployment successful!"
                exit 0
              fi

              sleep 2
            done

            echo "Deployment health check failed!"
            exit 1
          EOF
